name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Configure this environment in repo settings with required reviewers so a
    # tag push alone cannot publish without an approval step.
    environment: npm-publish
    permissions:
      contents: write # required to create the GitHub Release
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Check tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for ws in packages/sdk packages/react; do
            V="$(node -p "require('./$ws/package.json').version")"
            if [ "$V" != "$TAG" ]; then
              echo "::error::$ws is at version $V but the tag is $TAG"
              exit 1
            fi
          done

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      # NPM_TOKEN must be a granular automation token scoped to exactly these
      # two packages, with an expiry date.
      - name: Publish core
        run: yarn workspace @feelrobotics/keon-wifi-sdk npm publish --access public --provenance
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish react adapter
        run: yarn workspace @feelrobotics/keon-wifi-sdk-react npm publish --access public --provenance
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "Published to npm: [\`@feelrobotics/keon-wifi-sdk\`](https://www.npmjs.com/package/@feelrobotics/keon-wifi-sdk/v/$VERSION) · [\`@feelrobotics/keon-wifi-sdk-react\`](https://www.npmjs.com/package/@feelrobotics/keon-wifi-sdk-react/v/$VERSION)"
